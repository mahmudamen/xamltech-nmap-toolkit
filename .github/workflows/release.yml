name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: |
          git archive --format=tar.gz --prefix="xamltech-nmap-toolkit-${GITHUB_REF_NAME}/" \
            -o "xamltech-nmap-toolkit-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "xamltech-nmap-toolkit-${GITHUB_REF_NAME}.tar.gz" \
            > "xamltech-nmap-toolkit-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Publish artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xamltech-nmap-toolkit-*.tar.gz
            xamltech-nmap-toolkit-*.tar.gz.sha256
